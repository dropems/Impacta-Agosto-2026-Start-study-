<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Login</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Estilo do fundo e centralização */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1a2e 0%, #162a45 100%);
      padding: 20px;
    }

    /* Container do formulário */
    .login-container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px; /* Largura máxima em telas grandes */
      position: relative;
    }

    /* Barra superior com gradiente de destaque */
    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #00A3E0, #005691);
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #0c2340;
    }

    /* Grupos dos campos */
    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #1d2939;
      font-size: 14px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      font-size: 15px;
      background-color: #f9fafb;
      color: #101828;
      transition: all 0.3s ease;
    }

    /* Destaque ao focar no campo */
    .input-group input:focus {
      outline: none;
      border-color: #00a3e0;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 163, 224, 0.2);
    }

    /* Botão Conectar */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #00a3e0;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #0084ff;
    }

    /* Ajuste para telas menores */
    @media (max-width: 480px) {
      .login-container {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Entrar</h2>
    <form action="#" method="POST">
      
      <div class="input-group">
        <label for="login">Login</label>
        <input type="text" id="login" name="login" placeholder="Digite seu usuário ou e-mail" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
      </div>

      <button type="submit" class="btn-submit">Conectar</button>

    </form>
  </div>

</body>
</html>
